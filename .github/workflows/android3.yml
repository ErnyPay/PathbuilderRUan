name: Gran 2e 3.0 reference UX verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-reference-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build complete rules corpus and 3.0 UX
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py scripts/enrich_runtime.py scripts/inject_ability_choices.py scripts/inject_rule_constraints.py scripts/apply_ru_dictionary.py scripts/extend_runtime_2_0.py scripts/spell_rules_2_0.py scripts/prepare_2_0.py scripts/prepare_3_0.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py
          python3 scripts/enrich_runtime.py
          python3 scripts/inject_ability_choices.py
          python3 scripts/inject_rule_constraints.py
          python3 scripts/apply_ru_dictionary.py
          python3 scripts/extend_runtime_2_0.py
          python3 scripts/spell_rules_2_0.py
          python3 scripts/prepare_2_0.py
          python3 scripts/prepare_3_0.py

      - name: Verify rule corpus and 3.0 structure
        run: |
          test -s app/src/main/assets/rules.db
          test -s app/src/main/assets/ru_names.json
          test -s app/src/main/assets/ru_text.json
          python3 - <<'PY'
          import json, sqlite3, os
          db=sqlite3.connect('app/src/main/assets/rules.db')
          total=db.execute('select count(*) from rules').fetchone()[0]
          feats=db.execute("select count(*) from rules where category='feat'").fetchone()[0]
          spells=db.execute("select count(*) from rules where category='spell'").fetchone()[0]
          equipment=db.execute("select count(*) from rules where category='equipment'").fetchone()[0]
          names=json.load(open('app/src/main/assets/ru_names.json',encoding='utf-8'))
          texts=json.load(open('app/src/main/assets/ru_text.json',encoding='utf-8'))
          print('rules',total,'feats',feats,'spells',spells,'equipment',equipment,'ru names',len(names),'ru text',len(texts))
          assert total > 16000 and feats > 6000 and spells > 1900 and equipment > 5000
          assert len(names) > 15000 and len(texts) > 15000
          db.close()
          PY
          grep -q 'СБОРКА • ПЛАН 1–20' app/src/main/java/ru/gran/edge2e/MainActivityV3.java
          grep -q 'addNav(nav, "ПЕРСОНАЖ", "sheet")' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'case "feats": showFeats' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'case "pets": showPets' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'case "effects": showEffects' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'МОИ ПЕРСОНАЖИ' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q "versionName '3.0.0'" app/build.gradle

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          unzip -l "$APK" | grep 'assets/rules.db'
          unzip -l "$APK" | grep 'assets/ru_names.json'
          unzip -l "$APK" | grep 'assets/ru_text.json'
          ls -lh "$APK" app/src/main/assets/rules.db

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Exercise BUILD and PLAY modes on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell dumpsys package ru.gran.gran2e | grep 'versionName=3.0.0'

            adb shell am force-stop ru.gran.gran2e
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV3
            sleep 15
            test -n "$(adb shell pidof ru.gran.gran2e | tr -d '\r')" || (adb logcat -d -v time | tail -n 800; exit 1)
            adb shell uiautomator dump /sdcard/build3.xml
            adb shell cat /sdcard/build3.xml > build3.xml
            grep -q 'ГРАНЬ 2e' build3.xml
            grep -q 'СБОРКА' build3.xml
            grep -q 'ИГРА' build3.xml
            grep -q 'ГЕРОИ' build3.xml
            grep -q 'ПЛАН 1–20' build3.xml
            grep -q 'ПРОГРЕССИЯ 1–20' build3.xml
            adb exec-out screencap -p > gran2e-3-build.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen sheet
            sleep 4
            adb shell uiautomator dump /sdcard/play3.xml
            adb shell cat /sdcard/play3.xml > play3.xml
            grep -q 'ПЕРСОНАЖ' play3.xml
            grep -q 'АТАКИ' play3.xml
            grep -q 'ЗАЩИТА' play3.xml
            grep -q 'НАВЫКИ' play3.xml
            grep -q 'ФИТЫ' play3.xml
            adb exec-out screencap -p > gran2e-3-play.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen feats
            sleep 2
            adb shell uiautomator dump /sdcard/feats3.xml
            adb shell cat /sdcard/feats3.xml > feats3.xml
            grep -q 'ФИТЫ И ОСОБЕННОСТИ' feats3.xml

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen pets
            sleep 2
            adb shell uiautomator dump /sdcard/pets3.xml
            adb shell cat /sdcard/pets3.xml > pets3.xml
            grep -q 'ПИТОМЦЫ И КОМПАНЬОНЫ' pets3.xml
            adb exec-out screencap -p > gran2e-3-pets.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen effects
            sleep 2
            adb shell uiautomator dump /sdcard/effects3.xml
            adb shell cat /sdcard/effects3.xml > effects3.xml
            grep -q 'ЭФФЕКТЫ И СОСТОЯНИЯ' effects3.xml

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen profiles
            sleep 2
            adb shell uiautomator dump /sdcard/profiles3.xml
            adb shell cat /sdcard/profiles3.xml > profiles3.xml
            grep -q 'МОИ ПЕРСОНАЖИ' profiles3.xml
            adb exec-out screencap -p > gran2e-3-profiles.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen spells
            sleep 2
            adb shell uiautomator dump /sdcard/spells3.xml
            adb shell cat /sdcard/spells3.xml > spells3.xml
            grep -q 'нет источника заклинаний' spells3.xml

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen equipment
            sleep 2
            adb shell uiautomator dump /sdcard/equipment3.xml
            adb shell cat /sdcard/equipment3.xml > equipment3.xml
            grep -q 'Поиск предмета' equipment3.xml

      - name: Upload verified Gran 2e 3.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-3.0.0-reference-ux-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-3-build.png
            gran2e-3-play.png
            gran2e-3-pets.png
            gran2e-3-profiles.png
            build3.xml
            play3.xml
            feats3.xml
            pets3.xml
            effects3.xml
            profiles3.xml
            spells3.xml
            equipment3.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
