name: Gran 2e 3.3 knowledge reference verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-knowledge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build rules and generated UX
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py scripts/enrich_runtime.py scripts/inject_ability_choices.py scripts/inject_rule_constraints.py scripts/apply_ru_dictionary.py scripts/extend_runtime_2_0.py scripts/spell_rules_2_0.py scripts/prepare_2_0.py scripts/prepare_3_0.py scripts/runes_3_0.py scripts/combat_3_1.py scripts/spellcasting_3_2.py scripts/knowledge_data_3_3.py scripts/knowledge_3_3.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py
          python3 scripts/enrich_runtime.py
          python3 scripts/inject_ability_choices.py
          python3 scripts/inject_rule_constraints.py
          python3 scripts/apply_ru_dictionary.py
          python3 scripts/extend_runtime_2_0.py
          python3 scripts/spell_rules_2_0.py
          python3 scripts/knowledge_data_3_3.py
          python3 scripts/prepare_2_0.py
          python3 scripts/prepare_3_0.py
          python3 scripts/runes_3_0.py
          python3 scripts/combat_3_1.py
          python3 scripts/spellcasting_3_2.py
          python3 scripts/knowledge_3_3.py

      - name: Verify data and mechanics
        run: |
          test -s app/src/main/assets/rules.db
          python3 - <<'PY'
          import json,sqlite3
          db=sqlite3.connect('app/src/main/assets/rules.db')
          assert db.execute('select count(*) from rules').fetchone()[0] > 16000
          human=json.loads(db.execute("select json from rules where category='ancestry' and name='Human'").fetchone()[0])
          dwarf=json.loads(db.execute("select json from rules where category='ancestry' and name='Dwarf'").fetchone()[0])
          acolyte=json.loads(db.execute("select json from rules where category='background' and name='Acolyte'").fetchone()[0])
          multilingual=json.loads(db.execute("select json from rules where category='feat' and name='Multilingual'").fetchone()[0])
          print('Human languages',human['meta'].get('languages'),human['meta'].get('additionalLanguages'),human['meta'].get('additionalLanguageChoices'))
          print('Dwarf access',dwarf['meta'].get('additionalLanguageChoices'))
          print('Acolyte lore',acolyte['meta'].get('lore'),'Multilingual slots',multilingual['meta'].get('languageSlots'))
          assert human['meta'].get('additionalLanguages') == 1
          assert 'common' in human['meta'].get('languages',[])
          assert 'gnomish' in dwarf['meta'].get('additionalLanguageChoices',[])
          assert acolyte['meta'].get('lore')
          assert multilingual['meta'].get('languageSlots') == 2
          db.close()
          PY
          grep -q 'Math.max(0,stats==null?0:stats.ability("int"))' app/src/main/java/ru/gran/edge2e/KnowledgeRules.java
          grep -q 'if(society>=3)slots++' app/src/main/java/ru/gran/edge2e/KnowledgeRules.java
          grep -q 'if(level>=15)return 4;if(level>=7)return 3;if(level>=3)return 2' app/src/main/java/ru/gran/edge2e/KnowledgeRules.java
          grep -q 'KnowledgeState.PREFS' app/src/main/java/ru/gran/edge2e/CharacterProfiles.java
          grep -q 'ЯЗЫКИ' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'Additional Lore' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'ПОДГОТОВЛЕННЫЕ СЛОТЫ' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'CombatRules.grantedStrikes' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q "versionName '3.3.0'" app/build.gradle

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          unzip -l "$APK" | grep 'assets/rules.db'
          unzip -l "$APK" | grep 'assets/ru_names.json'

      - name: Prepare Android fixtures
        run: |
          cat > ci-wizard.xml <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map><string name="state">{&quot;name&quot;:&quot;CI Wizard&quot;,&quot;className&quot;:&quot;Wizard&quot;,&quot;level&quot;:3,&quot;hp&quot;:10,&quot;maxHp&quot;:10}</string></map>
          XML
          cat > ci-knowledge-character.xml <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map><string name="state">{&quot;name&quot;:&quot;CI Scholar&quot;,&quot;ancestry&quot;:&quot;Human&quot;,&quot;background&quot;:&quot;Acolyte&quot;,&quot;level&quot;:3,&quot;hp&quot;:10,&quot;maxHp&quot;:10,&quot;choices&quot;:{&quot;L2:skill&quot;:&quot;BocFD2KV0qgUC76x\u001fAdditional Lore&quot;}}</string></map>
          XML
          cat > ci-knowledge-state.xml <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map><string name="state">{&quot;languages&quot;:[&quot;draconic&quot;],&quot;additionalLores&quot;:[&quot;Военная история&quot;]}</string></map>
          XML

      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Exercise languages, Lore, spells and combat on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/device33.sh

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-3.3.0-knowledge-reference-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-33-languages.png
            gran2e-33-lore.png
            attack33.xml
            wizard33.xml
            knowledge33-top.xml
            knowledge33-all.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
