name: Android release verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build local PF2e rules database
        run: python3 scripts/build_rules.py

      - name: Verify rules database
        run: |
          test -s app/src/main/assets/rules.db
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect('app/src/main/assets/rules.db')
          n = db.execute('select count(*) from rules').fetchone()[0]
          print('Rules rows:', n)
          assert n > 1000
          print('Classes:', db.execute("select count(*) from rules where category='class'").fetchone()[0])
          print('Feats:', db.execute("select count(*) from rules where category='feat'").fetchone()[0])
          print('Spells:', db.execute("select count(*) from rules where category='spell'").fetchone()[0])
          print('Equipment:', db.execute("select count(*) from rules where category='equipment'").fetchone()[0])
          db.close()
          PY

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ls -lh "$APK"

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Install, launch and inspect on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ru.gran.edge2e
            adb shell am start -n ru.gran.edge2e/.MainActivity
            sleep 8
            adb shell pidof ru.gran.edge2e
            test -n "$(adb shell pidof ru.gran.edge2e | tr -d '\r')" || (adb logcat -d -v time | tail -n 500; exit 1)
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep ru.gran.edge2e
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml > window.xml
            grep -q 'ГРАНЬ 2e' window.xml || (cat window.xml; adb logcat -d -v time | tail -n 300; exit 1)
            adb exec-out screencap -p > gran2e-screen.png
            test -s gran2e-screen.png

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-verified-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-screen.png
            window.xml
          if-no-files-found: error
          retention-days: 30
