name: Android release verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build local PF2e rules corpus
        run: python3 scripts/build_rules.py

      - name: Verify rules corpus
        run: |
          test -s app/src/main/assets/rules.jsonl
          LINES=$(wc -l < app/src/main/assets/rules.jsonl)
          echo "Rules rows: $LINES"
          test "$LINES" -gt 1000

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ru.gran.edge2e
            adb shell am start -W -n ru.gran.edge2e/.MainActivity
            sleep 3
            PID=$(adb shell pidof ru.gran.edge2e | tr -d '\r')
            test -n "$PID"
            echo "Gran 2e PID: $PID"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep ru.gran.edge2e

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-verified-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
