name: Android release verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build executable PF2e rules database
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py scripts/enrich_runtime.py scripts/inject_ability_choices.py scripts/inject_rule_constraints.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py
          python3 scripts/enrich_runtime.py
          python3 scripts/inject_ability_choices.py
          python3 scripts/inject_rule_constraints.py

      - name: Verify dictionaries and executable rule elements
        run: |
          test -s app/src/main/assets/rules.db
          test -s app/src/main/assets/licenses/ORCLicense.md
          test -s app/src/main/assets/licenses/OpenGameLicense.md
          test -s app/src/main/assets/THIRD_PARTY_NOTICES.txt
          python3 - <<'PY'
          import json, sqlite3, collections
          db = sqlite3.connect('app/src/main/assets/rules.db')
          n = db.execute('select count(*) from rules').fetchone()[0]
          version = db.execute('pragma user_version').fetchone()[0]
          classes = db.execute("select count(*) from rules where category='class'").fetchone()[0]
          feats = db.execute("select count(*) from rules where category='feat'").fetchone()[0]
          spells = db.execute("select count(*) from rules where category='spell'").fetchone()[0]
          equipment = db.execute("select count(*) from rules where category='equipment'").fetchone()[0]
          keys = collections.Counter(); with_runtime = 0; ability_choices = 0; only_l1 = 0; repeatable = 0
          for (raw,) in db.execute('select json from rules'):
              data = json.loads(raw); meta = data.get('meta', {})
              elems = meta.get('ruleElements', [])
              if elems: with_runtime += 1
              if data.get('category') == 'feat':
                  only_l1 += int(bool(meta.get('onlyLevel1')))
                  mt = meta.get('maxTakable', 1)
                  repeatable += int(mt is None or (isinstance(mt, int) and mt > 1))
              for e in elems:
                  if isinstance(e, dict):
                      keys[e.get('key','<unknown>')] += 1
                      ability_choices += int(e.get('_granSynthetic') == 'ability-building')
          print('Rules:', n, 'version:', version, 'runtime rows:', with_runtime)
          print('Classes:', classes, 'feats:', feats, 'spells:', spells, 'equipment:', equipment)
          print('Rule elements:', keys.most_common(20), 'ability choices:', ability_choices)
          print('onlyLevel1:', only_l1, 'repeatable:', repeatable)
          assert version == 5
          assert n > 15000 and classes >= 25 and feats > 6000 and spells > 1900 and equipment > 5000
          assert with_runtime > 2500
          assert keys['ChoiceSet'] > 1000 and keys['ActiveEffectLike'] > 100 and keys['GrantItem'] > 100
          assert ability_choices > 1000 and only_l1 > 20 and repeatable > 20

          fighter = json.loads(db.execute("select json from rules where category='class' and name='Fighter'").fetchone()[0])
          fkeys = [e.get('key') for e in fighter['meta']['ruleElements']]
          fflags = {e.get('flag') for e in fighter['meta']['ruleElements'] if e.get('key') == 'ChoiceSet'}
          assert 'ChoiceSet' in fkeys and 'ActiveEffectLike' in fkeys and fighter['meta']['features']
          assert {'granClassKey','granFree1_0','granFree5_0','granFree20_3'} <= fflags

          human = json.loads(db.execute("select json from rules where category='ancestry' and name='Human'").fetchone()[0])
          hflags = {e.get('flag') for e in human['meta']['ruleElements'] if e.get('key') == 'ChoiceSet'}
          assert {'granAncestryBoost0','granAncestryBoost1'} <= hflags

          acolyte = json.loads(db.execute("select json from rules where category='background' and name='Acolyte'").fetchone()[0])
          aflags = {e.get('flag') for e in acolyte['meta']['ruleElements'] if e.get('key') == 'ChoiceSet'}
          assert {'granBackgroundBoost0','granBackgroundBoost1'} <= aflags

          bard_ded = json.loads(db.execute("select json from rules where category='feat' and name='Bard Dedication'").fetchone()[0])
          muse = next(e for e in bard_ded['meta']['ruleElements'] if e.get('key') == 'ChoiceSet' and e.get('flag') == 'dedicationMuse')
          assert isinstance(muse.get('choices'), list) and len(muse['choices']) >= 4
          assert any(e.get('_granSynthetic') == 'subfeatures.proficiencies' and 'spellcasting' in e.get('path','') for e in bard_ded['meta']['ruleElements'])

          wall = json.loads(db.execute("select json from rules where category='feat' and name='Wall Jump'").fetchone()[0])
          assert any(r.get('kind') == 'skill' and r.get('skill') == 'athletics' and r.get('rank') == 3 for r in wall['meta']['requirementsParsed'])
          db.close()
          PY

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          ls -lh "$APK" app/src/main/assets/rules.db

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Install and inspect planner on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ru.gran.gran2e
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV3
            sleep 15
            test -n "$(adb shell pidof ru.gran.gran2e | tr -d '\r')" || (adb logcat -d -v time | tail -n 700; exit 1)
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep 'ru.gran.edge2e.MainActivityV3'
            adb shell uiautomator dump /sdcard/window-top.xml
            adb shell cat /sdcard/window-top.xml > window-top.xml
            grep -q 'ГРАНЬ 2e' window-top.xml
            grep -q 'ПЛАН ПЕРСОНАЖА' window-top.xml
            grep -q 'BUILD' window-top.xml
            grep -q 'ПРОГРЕССИЯ 1–20' window-top.xml
            grep -q 'СИЛ' window-top.xml
            grep -q 'ЛВК' window-top.xml
            adb exec-out screencap -p > gran2e-planner-top.png
            adb shell input swipe 540 1900 540 650 650
            sleep 2
            adb shell uiautomator dump /sdcard/window-scroll.xml
            adb shell cat /sdcard/window-scroll.xml > window-scroll.xml
            grep -q 'УРОВЕНЬ 1' window-scroll.xml || grep -q 'УРОВЕНЬ 2' window-scroll.xml
            adb exec-out screencap -p > gran2e-planner-scroll.png
            test -s gran2e-planner-top.png
            test -s gran2e-planner-scroll.png

      - name: Upload verified planner APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-1.3.0-planner-verified-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-planner-top.png
            gran2e-planner-scroll.png
            window-top.xml
            window-scroll.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
