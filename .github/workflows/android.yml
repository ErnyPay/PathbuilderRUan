name: Android release verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build rules Russian dictionaries and runtime
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py scripts/enrich_runtime.py scripts/inject_ability_choices.py scripts/inject_rule_constraints.py scripts/apply_ru_dictionary.py scripts/extend_runtime_2_0.py scripts/prepare_2_0.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py
          python3 scripts/enrich_runtime.py
          python3 scripts/inject_ability_choices.py
          python3 scripts/inject_rule_constraints.py
          python3 scripts/apply_ru_dictionary.py
          python3 scripts/extend_runtime_2_0.py
          python3 scripts/prepare_2_0.py

      - name: Verify corpus runtime and Russian coverage
        run: |
          test -s app/src/main/assets/rules.db
          test -s app/src/main/assets/ru_names.json
          test -s app/src/main/assets/ru_text.json
          test -s app/src/main/assets/licenses/ORCLicense.md
          test -s app/src/main/assets/licenses/OpenGameLicense.md
          test -s app/src/main/assets/licenses/PF2ERUS_LICENSE.txt
          python3 - <<'PY'
          import json, sqlite3, collections, os
          db = sqlite3.connect('app/src/main/assets/rules.db')
          n = db.execute('select count(*) from rules').fetchone()[0]
          version = db.execute('pragma user_version').fetchone()[0]
          classes = db.execute("select count(*) from rules where category='class'").fetchone()[0]
          feats = db.execute("select count(*) from rules where category='feat'").fetchone()[0]
          spells = db.execute("select count(*) from rules where category='spell'").fetchone()[0]
          equipment = db.execute("select count(*) from rules where category='equipment'").fetchone()[0]
          keys = collections.Counter(); with_runtime = 0; ability_choices = 0
          ru_meta = 0; ru_desc = 0
          for (raw,) in db.execute('select json from rules'):
              data = json.loads(raw); meta = data.get('meta', {})
              elems = meta.get('ruleElements', [])
              if elems: with_runtime += 1
              ru_meta += int(bool(meta.get('ruName')))
              ru_desc += int(bool(meta.get('ruDescription')))
              for e in elems:
                  if isinstance(e, dict):
                      keys[e.get('key','<unknown>')] += 1
                      ability_choices += int(e.get('_granSynthetic') == 'ability-building')
          names = json.load(open('app/src/main/assets/ru_names.json', encoding='utf-8'))
          texts = json.load(open('app/src/main/assets/ru_text.json', encoding='utf-8'))
          print('Rules:', n, 'version:', version, 'classes:', classes, 'feats:', feats, 'spells:', spells, 'equipment:', equipment)
          print('Runtime rows:', with_runtime, 'Rule elements:', keys.most_common(22), 'ability choices:', ability_choices)
          print('Russian names asset:', len(names), 'text rows:', len(texts), 'ru meta:', ru_meta, 'ru descriptions:', ru_desc)
          print('Russian samples:', list(names.items())[:20])
          assert version == 5
          assert n > 15000 and classes >= 25 and feats > 6000 and spells > 1900 and equipment > 5000
          assert with_runtime > 2500
          assert keys['ChoiceSet'] > 1000 and keys['ActiveEffectLike'] > 100 and keys['GrantItem'] > 100
          assert keys['BaseSpeed'] > 100 and keys['MartialProficiency'] > 50
          assert ability_choices > 1000
          assert len(names) >= 15000 and ru_meta >= 15000 and ru_desc >= 14000
          assert os.path.getsize('app/src/main/assets/ru_names.json') > 500000
          fighter = json.loads(db.execute("select json from rules where category='class' and name='Fighter'").fetchone()[0])
          assert fighter['meta']['features']
          wall = json.loads(db.execute("select json from rules where category='feat' and name='Wall Jump'").fetchone()[0])
          assert any(r.get('kind') == 'skill' and r.get('skill') == 'athletics' and r.get('rank') == 3 for r in wall['meta']['requirementsParsed'])
          db.close()
          PY
          grep -q 'putExtra("screen", target)' app/src/main/java/ru/gran/edge2e/MainActivityV3.java
          grep -q 'private String screen = "sheet"' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'case "BaseSpeed"' app/src/main/java/ru/gran/edge2e/RuleRuntime.java
          grep -q 'case "MartialProficiency"' app/src/main/java/ru/gran/edge2e/RuleRuntime.java
          grep -q 'runtime.martialRank(weapon' app/src/main/java/ru/gran/edge2e/DerivedStats.java
          grep -q 'runtime.baseSpeed("land"' app/src/main/java/ru/gran/edge2e/DerivedStats.java
          grep -q '#47131E' app/src/main/res/values/styles.xml
          grep -q '#7D1F30' app/src/main/res/values/styles.xml

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          unzip -l "$APK" | grep 'assets/ru_names.json'
          unzip -l "$APK" | grep 'assets/ru_text.json'
          ls -lh "$APK" app/src/main/assets/rules.db app/src/main/assets/ru_names.json app/src/main/assets/ru_text.json

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Install and inspect all primary sections on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ru.gran.gran2e
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV3
            sleep 15
            test -n "$(adb shell pidof ru.gran.gran2e | tr -d '\r')" || (adb logcat -d -v time | tail -n 700; exit 1)
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep 'ru.gran.edge2e.MainActivityV3'
            adb shell uiautomator dump /sdcard/build.xml
            adb shell cat /sdcard/build.xml > build.xml
            grep -q 'ГРАНЬ 2e' build.xml
            grep -q 'ПЛАН ПЕРСОНАЖА' build.xml
            grep -q 'BUILD' build.xml
            grep -q 'ЗАЩИТА' build.xml
            grep -q 'АТАКА' build.xml
            grep -q 'СНАРЯЖ' build.xml
            grep -q 'ЗАКЛ' build.xml
            grep -q 'ПРОГРЕССИЯ 1–20' build.xml
            adb exec-out screencap -p > gran2e-2-build.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen defense
            sleep 3
            adb shell uiautomator dump /sdcard/defense.xml
            adb shell cat /sdcard/defense.xml > defense.xml
            grep -q 'СТОЙКОСТЬ' defense.xml
            adb exec-out screencap -p > gran2e-2-defense.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen attack
            sleep 2
            adb shell uiautomator dump /sdcard/attack.xml
            adb shell cat /sdcard/attack.xml > attack.xml
            grep -q 'АТАКА' attack.xml
            adb exec-out screencap -p > gran2e-2-attack.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen spells
            sleep 2
            adb shell uiautomator dump /sdcard/spells.xml
            adb shell cat /sdcard/spells.xml > spells.xml
            grep -q 'Поиск заклинания' spells.xml

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen equipment
            sleep 2
            adb shell uiautomator dump /sdcard/equipment.xml
            adb shell cat /sdcard/equipment.xml > equipment.xml
            grep -q 'Поиск предмета' equipment.xml

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen combat
            sleep 2
            adb shell uiautomator dump /sdcard/combat.xml
            adb shell cat /sdcard/combat.xml > combat.xml
            grep -q 'СОСТОЯНИЯ' combat.xml
            grep -q 'БЫСТРЫЕ БРОСКИ' combat.xml
            adb exec-out screencap -p > gran2e-2-combat.png

      - name: Upload verified Gran 2e 2.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-2.0.0-reference-parity-verified-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-2-build.png
            gran2e-2-defense.png
            gran2e-2-attack.png
            gran2e-2-combat.png
            build.xml
            defense.xml
            attack.xml
            spells.xml
            equipment.xml
            combat.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
