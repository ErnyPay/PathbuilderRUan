name: Android release verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build local PF2e rules database
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py

      - name: Verify dictionaries, structured rules and licenses
        run: |
          test -s app/src/main/assets/rules.db
          test -s app/src/main/assets/licenses/ORCLicense.md
          test -s app/src/main/assets/licenses/OpenGameLicense.md
          test -s app/src/main/assets/THIRD_PARTY_NOTICES.txt
          python3 - <<'PY'
          import json, sqlite3
          db = sqlite3.connect('app/src/main/assets/rules.db')
          n = db.execute('select count(*) from rules').fetchone()[0]
          version = db.execute('pragma user_version').fetchone()[0]
          columns = {r[1] for r in db.execute('pragma table_info(rules)')}
          classes = db.execute("select count(*) from rules where category='class'").fetchone()[0]
          feats = db.execute("select count(*) from rules where category='feat'").fetchone()[0]
          spells = db.execute("select count(*) from rules where category='spell'").fetchone()[0]
          equipment = db.execute("select count(*) from rules where category='equipment'").fetchone()[0]
          grouped_class = db.execute("select count(*) from rules where category='feat' and subtype='class' and group_key<>''").fetchone()[0]
          grouped_arch = db.execute("select count(*) from rules where category='feat' and subtype='archetype' and group_key<>''").fetchone()[0]
          remaster = db.execute("select count(*) from rules where remaster=1").fetchone()[0]
          print('Rules:', n, 'v', version, 'classes', classes, 'feats', feats, 'spells', spells, 'equipment', equipment)
          print('Grouped class feats:', grouped_class, 'grouped archetype feats:', grouped_arch, 'remaster:', remaster)
          assert version == 4
          assert {'group_key','rarity','remaster','source','json'} <= columns
          assert n > 15000 and classes >= 25 and feats > 6000 and spells > 1900 and equipment > 5000
          assert grouped_class > 1500 and grouped_arch > 1800 and remaster > 5000
          fighter = json.loads(db.execute("select json from rules where category='class' and name='Fighter'").fetchone()[0])
          assert fighter['meta']['hp'] == 10
          assert fighter['meta']['attacks']['martial'] >= 1
          assert fighter['meta']['savingThrows']['fortitude'] >= 1
          assert len(fighter['meta']['features']) >= 10
          wizard = json.loads(db.execute("select json from rules where category='class' and name='Wizard'").fetchone()[0])
          assert wizard['meta']['traditions'] == ['arcane']
          wall = json.loads(db.execute("select json from rules where category='feat' and name='Wall Jump'").fetchone()[0])
          reqs = wall['meta']['requirementsParsed']
          assert any(r.get('kind') == 'skill' and r.get('skill') == 'athletics' and r.get('rank') == 3 for r in reqs)
          assert wall['meta']['rarity'] == 'common'
          assert wall['meta']['sourcePath'].endswith('wall-jump.json')
          fighter_feat = json.loads(db.execute("select json from rules where category='feat' and subtype='class' and group_key='fighter' limit 1").fetchone()[0])
          assert fighter_feat['meta']['groupKey'] == 'fighter'
          arch_feat = json.loads(db.execute("select json from rules where category='feat' and subtype='archetype' and group_key<>'' limit 1").fetchone()[0])
          assert arch_feat['meta']['groupKey']
          human_heritage = json.loads(db.execute("select json from rules where category='heritage' and name='Versatile Human'").fetchone()[0])
          assert human_heritage['meta']['ancestry'] == 'Human' and human_heritage['meta']['versatile'] is False
          beastkin = json.loads(db.execute("select json from rules where category='heritage' and name='Beastkin'").fetchone()[0])
          assert beastkin['meta']['versatile'] is True
          sword = json.loads(db.execute("select json from rules where category='equipment' and name='Longsword'").fetchone()[0])
          assert sword['meta']['damageDie'] == 'd8' and sword['meta']['damageType'] == 'slashing'
          force = json.loads(db.execute("select json from rules where category='spell' and name='Force Barrage'").fetchone()[0])
          assert 'arcane' in force['meta']['traditions'] and force['level'] == 1
          db.close()
          PY

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature and retain signer tool
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          test -s ci-tools/apksigner.jar
          ls -lh "$APK" app/src/main/assets/rules.db ci-tools/apksigner.jar

      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Install, launch and inspect rules build on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop ru.gran.gran2e
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2
            sleep 15
            adb shell pidof ru.gran.gran2e
            test -n "$(adb shell pidof ru.gran.gran2e | tr -d '\r')" || (adb logcat -d -v time | tail -n 500; exit 1)
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep 'ru.gran.edge2e.MainActivityV2'
            adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' || true
            adb shell uiautomator dump /sdcard/window-top.xml
            adb shell cat /sdcard/window-top.xml > window-top.xml
            head -c 20000 window-top.xml || true
            grep -q 'ГРАНЬ 2e' window-top.xml
            grep -q 'ПЛАНИРОВЩИК 1–20' window-top.xml
            grep -q '17025' window-top.xml || grep -q 'база 17025' window-top.xml
            adb exec-out screencap -p > gran2e-top.png
            adb shell input swipe 540 1900 540 650 600
            sleep 2
            adb shell uiautomator dump /sdcard/window-scroll.xml
            adb shell cat /sdcard/window-scroll.xml > window-scroll.xml
            grep -q 'УРОВЕНЬ 1' window-scroll.xml || grep -q 'УРОВЕНЬ 2' window-scroll.xml
            adb exec-out screencap -p > gran2e-scroll.png
            test -s gran2e-top.png
            test -s gran2e-scroll.png

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-1.1.0-rules-verified-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-top.png
            gran2e-scroll.png
            window-top.xml
            window-scroll.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
