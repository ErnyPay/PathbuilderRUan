name: Gran 2e 6.0 full reference verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-reference-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build rules, Russian corpus and full reference UX
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py scripts/enrich_runtime.py scripts/inject_ability_choices.py scripts/inject_rule_constraints.py scripts/apply_ru_dictionary.py scripts/extend_runtime_2_0.py scripts/spell_rules_2_0.py scripts/knowledge_data_3_3.py scripts/inventory_data_3_4.py scripts/prepare_2_0.py scripts/prepare_3_0.py scripts/runes_3_0.py scripts/combat_3_1.py scripts/spellcasting_3_2.py scripts/knowledge_3_3.py scripts/inventory_3_4.py scripts/frontpage_4_0.py scripts/build_wizard_4_1.py scripts/reference_play_4_2.py scripts/pf2ru_3_5.py scripts/reference_shell_5_0.py scripts/reference_full_6_0.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py
          python3 scripts/enrich_runtime.py
          python3 scripts/inject_ability_choices.py
          python3 scripts/inject_rule_constraints.py
          python3 scripts/apply_ru_dictionary.py
          python3 scripts/extend_runtime_2_0.py
          python3 scripts/spell_rules_2_0.py
          python3 scripts/knowledge_data_3_3.py
          python3 scripts/inventory_data_3_4.py
          python3 scripts/prepare_2_0.py
          python3 scripts/prepare_3_0.py
          python3 scripts/runes_3_0.py
          python3 scripts/combat_3_1.py
          python3 scripts/spellcasting_3_2.py
          python3 scripts/knowledge_3_3.py
          python3 scripts/inventory_3_4.py
          python3 scripts/frontpage_4_0.py
          python3 scripts/build_wizard_4_1.py
          python3 scripts/reference_play_4_2.py
          python3 scripts/pf2ru_3_5.py
          python3 scripts/reference_shell_5_0.py
          python3 scripts/reference_full_6_0.py

      - name: Verify full reference modules and Russian corpus
        run: |
          test -s app/src/main/assets/rules.db
          test -s app/src/main/assets/ru_names.json
          test -s app/src/main/assets/ru_text.json
          test -s app/src/main/assets/pf2ru_source.json
          grep -q 'ReferenceBuildActivity' app/src/main/AndroidManifest.xml
          grep -q 'ReferencePlayActivity' app/src/main/AndroidManifest.xml
          grep -q 'ReferenceCatalogActivity' app/src/main/AndroidManifest.xml
          grep -q 'ReferenceItemActivity' app/src/main/AndroidManifest.xml
          grep -q 'ReferenceMoreActivity' app/src/main/AndroidManifest.xml
          grep -q 'ОТКРЫТЬ ВСЕ ИНСТРУМЕНТЫ' app/src/main/java/ru/gran/edge2e/FrontPageActivity.java
          grep -q 'ReferenceBuildActivity.class' app/src/main/java/ru/gran/edge2e/FrontPageActivity.java
          grep -q 'ВСЕ БРАУЗЕРЫ И ИНСТРУМЕНТЫ' app/src/main/java/ru/gran/edge2e/ReferenceBuildActivity.java
          grep -q 'ЕЩЁ' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'ReferenceItemActivity.class' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'ReferenceCatalogActivity.class' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'case "ancestry"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "heritage"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "background"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "class"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "feat"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "spell"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "weapon"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "armor"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "shield"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "rune"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'case "condition"' app/src/main/java/ru/gran/edge2e/ReferenceCatalogActivity.java
          grep -q 'ЯЗЫКИ И LORE' app/src/main/java/ru/gran/edge2e/ReferenceMoreActivity.java
          grep -q 'КОПИРОВАТЬ JSON ПЕРСОНАЖА' app/src/main/java/ru/gran/edge2e/ReferenceMoreActivity.java
          grep -q 'РУНЫ' app/src/main/java/ru/gran/edge2e/ReferenceItemActivity.java
          grep -q 'ItemMods.potency' app/src/main/java/ru/gran/edge2e/DerivedStats.java
          grep -q "versionName '6.0.0'" app/build.gradle
          python3 - <<'PY'
          import json, sqlite3
          source=json.load(open('app/src/main/assets/pf2ru_source.json',encoding='utf-8'))
          assert source['name']=='PF2.RU'
          db=sqlite3.connect('app/src/main/assets/rules.db')
          rows=db.execute('select count(*) from rules').fetchone()[0]
          russian=json.load(open('app/src/main/assets/ru_names.json',encoding='utf-8'))
          required={'ancestry','background','class','heritage','feat','spell','equipment','condition','action'}
          cats={r[0] for r in db.execute('select distinct category from rules')}
          print('Local PF2e rules:',rows,'Russian names:',len(russian),'categories:',sorted(cats))
          assert rows > 15000
          assert len(russian) > 10000
          assert required.issubset(cats)
          db.close()
          PY

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature and assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          unzip -l "$APK" | grep 'assets/rules.db'
          unzip -l "$APK" | grep 'assets/ru_text.json'
          unzip -l "$APK" | grep 'assets/pf2ru_source.json'

      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Exercise Gran 6.0 full reference workflow on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell dumpsys package ru.gran.gran2e | grep 'versionName=6.0.0'

            adb shell am force-stop ru.gran.gran2e
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.FrontPageActivity
            sleep 5
            test -n "$(adb shell pidof ru.gran.gran2e | tr -d '\r')" || { adb logcat -d -v time | tail -n 1000; exit 1; }
            adb shell uiautomator dump /sdcard/gran60-front.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran60-front.xml > gran60-front.xml 2>/dev/null || true
            grep -q 'НОВЫЙ ПЕРСОНАЖ' gran60-front.xml
            grep -q 'ОТКРЫТЬ ВСЕ ИНСТРУМЕНТЫ' gran60-front.xml
            adb exec-out screencap -p > gran2e-60-front.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferenceBuildActivity
            sleep 4
            adb shell uiautomator dump /sdcard/gran60-build.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran60-build.xml > gran60-build.xml 2>/dev/null || true
            grep -q 'СБОРКА' gran60-build.xml
            grep -q 'УРОВНИ' gran60-build.xml
            grep -q 'ОСНОВА ПЕРСОНАЖА' gran60-build.xml
            grep -q 'РОД' gran60-build.xml
            grep -q 'НАСЛЕДИЕ' gran60-build.xml
            grep -q 'ПРЕДЫСТОРИЯ' gran60-build.xml
            grep -q 'КЛАСС' gran60-build.xml
            adb exec-out screencap -p > gran2e-60-build.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferenceMoreActivity
            sleep 3
            adb shell uiautomator dump /sdcard/gran60-more.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran60-more.xml > gran60-more.xml 2>/dev/null || true
            grep -q 'БИБЛИОТЕКА И ВЫБОРЫ' gran60-more.xml
            grep -q 'ЯЗЫКИ И LORE' gran60-more.xml
            grep -q 'КОПИРОВАТЬ JSON ПЕРСОНАЖА' gran60-more.xml
            adb exec-out screencap -p > gran2e-60-more.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferenceCatalogActivity --es mode weapon --ei maxLevel 20
            sleep 3
            adb shell uiautomator dump /sdcard/gran60-weapons.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran60-weapons.xml > gran60-weapons.xml 2>/dev/null || true
            grep -q 'ОРУЖИЕ' gran60-weapons.xml
            grep -q 'Показано:' gran60-weapons.xml
            adb exec-out screencap -p > gran2e-60-weapons.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferenceItemActivity --es itemId 8V4mgecGASsQ7fjl
            sleep 3
            adb shell uiautomator dump /sdcard/gran60-item.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran60-item.xml > gran60-item.xml 2>/dev/null || true
            grep -q 'ОРУЖИЕ' gran60-item.xml
            grep -q 'РУНЫ' gran60-item.xml
            grep -q 'Руна мощи' gran60-item.xml
            adb exec-out screencap -p > gran2e-60-item.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferencePlayActivity --es screen character
            sleep 3
            adb shell uiautomator dump /sdcard/gran60-play.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran60-play.xml > gran60-play.xml 2>/dev/null || true
            grep -q 'ПЕРСОНАЖ' gran60-play.xml
            grep -q 'АТАКИ' gran60-play.xml
            grep -q 'ЗАЩИТА' gran60-play.xml
            grep -q 'НАВЫКИ' gran60-play.xml
            grep -q 'ФИТЫ' gran60-play.xml
            grep -q 'ЗАКЛИНАНИЯ' gran60-play.xml
            adb exec-out screencap -p > gran2e-60-play.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferencePlayActivity --es screen gear
            sleep 3
            adb shell uiautomator dump /sdcard/gran60-gear.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran60-gear.xml > gran60-gear.xml 2>/dev/null || true
            grep -q 'СНАРЯЖЕНИЕ' gran60-gear.xml
            grep -q 'ОСНОВНОЙ ИНВЕНТАРЬ' gran60-gear.xml
            adb exec-out screencap -p > gran2e-60-gear.png

      - name: Upload verified Gran 2e 6.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-6.0.0-full-reference-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-60-front.png
            gran2e-60-build.png
            gran2e-60-more.png
            gran2e-60-weapons.png
            gran2e-60-item.png
            gran2e-60-play.png
            gran2e-60-gear.png
            gran60-*.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
