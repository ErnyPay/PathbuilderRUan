name: Gran 2e 4.2 reference PLAY verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-reference-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build rules, Russian corpus and reference UX
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py scripts/enrich_runtime.py scripts/inject_ability_choices.py scripts/inject_rule_constraints.py scripts/apply_ru_dictionary.py scripts/extend_runtime_2_0.py scripts/spell_rules_2_0.py scripts/knowledge_data_3_3.py scripts/inventory_data_3_4.py scripts/prepare_2_0.py scripts/prepare_3_0.py scripts/runes_3_0.py scripts/combat_3_1.py scripts/spellcasting_3_2.py scripts/knowledge_3_3.py scripts/inventory_3_4.py scripts/frontpage_4_0.py scripts/build_wizard_4_1.py scripts/reference_play_4_2.py scripts/pf2ru_3_5.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py
          python3 scripts/enrich_runtime.py
          python3 scripts/inject_ability_choices.py
          python3 scripts/inject_rule_constraints.py
          python3 scripts/apply_ru_dictionary.py
          python3 scripts/extend_runtime_2_0.py
          python3 scripts/spell_rules_2_0.py
          python3 scripts/knowledge_data_3_3.py
          python3 scripts/inventory_data_3_4.py
          python3 scripts/prepare_2_0.py
          python3 scripts/prepare_3_0.py
          python3 scripts/runes_3_0.py
          python3 scripts/combat_3_1.py
          python3 scripts/spellcasting_3_2.py
          python3 scripts/knowledge_3_3.py
          python3 scripts/inventory_3_4.py
          python3 scripts/frontpage_4_0.py
          python3 scripts/build_wizard_4_1.py
          python3 scripts/reference_play_4_2.py
          python3 scripts/pf2ru_3_5.py

      - name: Verify reference BUILD, PLAY structure and Russian corpus
        run: |
          test -s app/src/main/assets/rules.db
          test -s app/src/main/assets/ru_names.json
          test -s app/src/main/assets/ru_text.json
          test -s app/src/main/assets/pf2ru_source.json
          grep -q 'ReferencePlayActivity' app/src/main/AndroidManifest.xml
          grep -q 'ReferencePlayActivity.class' app/src/main/java/ru/gran/edge2e/FrontPageActivity.java
          grep -q 'ReferencePlayActivity.class' app/src/main/java/ru/gran/edge2e/MainActivityV3.java
          grep -q 'СОЗДАНИЕ ПЕРСОНАЖА' app/src/main/java/ru/gran/edge2e/MainActivityV3.java
          grep -q 'baseCandidates(String category)' app/src/main/java/ru/gran/edge2e/MainActivityV3.java
          grep -q 'Персонаж' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Атаки' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Защита' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Навыки' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Фиты' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Заклинания' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Снаряжение' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Питомцы' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Эффекты' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'ИСПОЛЬЗОВАТЬ СЛОТ' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'КОНТЕЙНЕРЫ' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q 'Животный-компаньон' app/src/main/java/ru/gran/edge2e/ReferencePlayActivity.java
          grep -q "versionName '4.2.0'" app/build.gradle
          python3 - <<'PY'
          import json, sqlite3
          source=json.load(open('app/src/main/assets/pf2ru_source.json',encoding='utf-8'))
          assert source['name']=='PF2.RU'
          db=sqlite3.connect('app/src/main/assets/rules.db')
          rows=db.execute('select count(*) from rules').fetchone()[0]
          russian=json.load(open('app/src/main/assets/ru_names.json',encoding='utf-8'))
          print('Local PF2e rules:',rows,'Russian names:',len(russian))
          assert rows > 15000
          assert len(russian) > 10000
          db.close()
          PY

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature and assets
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          unzip -l "$APK" | grep 'assets/rules.db'
          unzip -l "$APK" | grep 'assets/ru_text.json'
          unzip -l "$APK" | grep 'assets/pf2ru_source.json'

      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Exercise BUILD and reference PLAY pages on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell dumpsys package ru.gran.gran2e | grep 'versionName=4.2.0'

            adb shell am force-stop ru.gran.gran2e
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.FrontPageActivity
            sleep 5
            test -n "$(adb shell pidof ru.gran.gran2e | tr -d '\r')" || { adb logcat -d -v time | tail -n 900; exit 1; }
            adb shell uiautomator dump /sdcard/gran42-front.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran42-front.xml > gran42-front.xml 2>/dev/null || true
            grep -q 'НОВЫЙ ПЕРСОНАЖ' gran42-front.xml
            adb exec-out screencap -p > gran2e-42-front.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV3
            sleep 4
            adb shell uiautomator dump /sdcard/gran42-build.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran42-build.xml > gran42-build.xml 2>/dev/null || true
            grep -q 'СОЗДАНИЕ ПЕРСОНАЖА' gran42-build.xml
            grep -q 'Род' gran42-build.xml
            grep -q 'Наследие' gran42-build.xml
            adb exec-out screencap -p > gran2e-42-build.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferencePlayActivity --es screen character
            sleep 4
            adb shell uiautomator dump /sdcard/gran42-character.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran42-character.xml > gran42-character.xml 2>/dev/null || true
            grep -q 'ПЕРСОНАЖ' gran42-character.xml
            grep -q 'ХАРАКТЕРИСТИКИ' gran42-character.xml
            grep -q 'СПАСБРОСКИ И ВОСПРИЯТИЕ' gran42-character.xml
            adb exec-out screencap -p > gran2e-42-character.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferencePlayActivity --es screen attacks
            sleep 3
            adb shell uiautomator dump /sdcard/gran42-attacks.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran42-attacks.xml > gran42-attacks.xml 2>/dev/null || true
            grep -q 'АТАКИ' gran42-attacks.xml
            grep -q 'БОЕВЫЕ ПАРАМЕТРЫ' gran42-attacks.xml
            adb exec-out screencap -p > gran2e-42-attacks.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferencePlayActivity --es screen defenses
            sleep 3
            adb shell uiautomator dump /sdcard/gran42-defenses.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran42-defenses.xml > gran42-defenses.xml 2>/dev/null || true
            grep -q 'ЗАЩИТА' gran42-defenses.xml
            grep -q 'БРОНЯ' gran42-defenses.xml
            grep -q 'ЩИТ' gran42-defenses.xml
            adb exec-out screencap -p > gran2e-42-defenses.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferencePlayActivity --es screen gear
            sleep 3
            adb shell uiautomator dump /sdcard/gran42-gear.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran42-gear.xml > gran42-gear.xml 2>/dev/null || true
            grep -q 'СНАРЯЖЕНИЕ' gran42-gear.xml
            grep -q 'ОСНОВНОЙ ИНВЕНТАРЬ' gran42-gear.xml
            adb exec-out screencap -p > gran2e-42-gear.png

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.ReferencePlayActivity --es screen pets
            sleep 3
            adb shell uiautomator dump /sdcard/gran42-pets.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/gran42-pets.xml > gran42-pets.xml 2>/dev/null || true
            grep -q 'ПИТОМЦЫ' gran42-pets.xml
            grep -q 'ЖИВОТНЫЙ-КОМПАНЬОН' gran42-pets.xml
            adb exec-out screencap -p > gran2e-42-pets.png

      - name: Upload verified Gran 2e 4.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-4.2.0-reference-play-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-42-front.png
            gran2e-42-build.png
            gran2e-42-character.png
            gran2e-42-attacks.png
            gran2e-42-defenses.png
            gran2e-42-gear.png
            gran2e-42-pets.png
            gran42-*.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
