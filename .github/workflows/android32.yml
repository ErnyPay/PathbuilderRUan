name: Gran 2e 3.2 spellcasting reference verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-spellcasting-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build rules and 3.2 generated UI
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py scripts/enrich_runtime.py scripts/inject_ability_choices.py scripts/inject_rule_constraints.py scripts/apply_ru_dictionary.py scripts/extend_runtime_2_0.py scripts/spell_rules_2_0.py scripts/prepare_2_0.py scripts/prepare_3_0.py scripts/runes_3_0.py scripts/combat_3_1.py scripts/spellcasting_3_2.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py
          python3 scripts/enrich_runtime.py
          python3 scripts/inject_ability_choices.py
          python3 scripts/inject_rule_constraints.py
          python3 scripts/apply_ru_dictionary.py
          python3 scripts/extend_runtime_2_0.py
          python3 scripts/spell_rules_2_0.py
          python3 scripts/prepare_2_0.py
          python3 scripts/prepare_3_0.py
          python3 scripts/runes_3_0.py
          python3 scripts/combat_3_1.py
          python3 scripts/spellcasting_3_2.py

      - name: Verify rules and spellcasting implementation
        run: |
          test -s app/src/main/assets/rules.db
          test -s app/src/main/assets/ru_names.json
          test -s app/src/main/assets/ru_text.json
          python3 - <<'PY'
          import json, sqlite3
          db=sqlite3.connect('app/src/main/assets/rules.db')
          total=db.execute('select count(*) from rules').fetchone()[0]
          wizard=json.loads(db.execute("select json from rules where category='class' and name='Wizard'").fetchone()[0])
          bard=json.loads(db.execute("select json from rules where category='class' and name='Bard'").fetchone()[0])
          print('rules',total,'Wizard traditions',wizard['meta'].get('traditions'),'Bard',bard['meta'].get('traditions'))
          assert total > 16000
          assert wizard['meta'].get('traditions') == ['arcane']
          assert bard['meta'].get('traditions') == ['occult']
          db.close()
          PY
          grep -q 'class SpellcastingState' app/src/main/java/ru/gran/edge2e/SpellcastingState.java
          grep -q 'class SpellcastingRules' app/src/main/java/ru/gran/edge2e/SpellcastingRules.java
          grep -q 'ПОДГОТОВЛЕННЫЕ СЛОТЫ' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'РЕПЕРТУАР И СЛОТЫ' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'Signature spell\|SIGNATURE' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'SpellcastingState.PREFS' app/src/main/java/ru/gran/edge2e/CharacterProfiles.java
          grep -q 'CombatRules.grantedStrikes' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q "versionName '3.2.0'" app/build.gradle

      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature and corpus
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          unzip -l "$APK" | grep 'assets/rules.db'
          unzip -l "$APK" | grep 'assets/ru_names.json'
          unzip -l "$APK" | grep 'assets/ru_text.json'
          ls -lh "$APK" app/src/main/assets/rules.db

      - name: Prepare character fixtures
        run: |
          cat > ci-wizard.xml <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map>
            <string name="state">{&quot;name&quot;:&quot;CI Wizard&quot;,&quot;className&quot;:&quot;Wizard&quot;,&quot;level&quot;:3,&quot;hp&quot;:10,&quot;maxHp&quot;:10}</string>
          </map>
          XML
          cat > ci-bard.xml <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map>
            <string name="state">{&quot;name&quot;:&quot;CI Bard&quot;,&quot;className&quot;:&quot;Bard&quot;,&quot;level&quot;:3,&quot;hp&quot;:10,&quot;maxHp&quot;:10}</string>
          </map>
          XML

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Exercise combat and prepared/spontaneous casting on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell dumpsys package ru.gran.gran2e | grep 'versionName=3.2.0'

            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV3
            sleep 10
            test -n "$(adb shell pidof ru.gran.gran2e | tr -d '\r')" || (adb logcat -d -v time | tail -n 900; exit 1)

            # Combat 3.1 must stay intact.
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen attack
            for i in 1 2 3 4 5; do
              sleep 2
              adb shell uiautomator dump /sdcard/attack32.xml >/dev/null 2>&1 || true
              adb shell cat /sdcard/attack32.xml > attack32.xml 2>/dev/null || true
              if grep -q 'Критический урон' attack32.xml 2>/dev/null; then break; fi
            done
            grep -q 'MAP 0 /' attack32.xml
            grep -q 'Критический урон' attack32.xml

            # Wizard level 3 fixture.
            adb push ci-wizard.xml /data/local/tmp/ci-character.xml >/dev/null
            adb shell run-as ru.gran.gran2e mkdir -p shared_prefs
            adb shell run-as ru.gran.gran2e cp /data/local/tmp/ci-character.xml shared_prefs/gran2e_character.xml
            adb shell run-as ru.gran.gran2e rm -f shared_prefs/gran2e_spellcasting_v32.xml
            adb shell am force-stop ru.gran.gran2e
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen spells
            sleep 5
            adb shell uiautomator dump /sdcard/wizard32-top.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/wizard32-top.xml > wizard32-top.xml 2>/dev/null || true
            grep -q 'Wizard' wizard32-top.xml || (adb logcat -d -v time | tail -n 700; cat wizard32-top.xml; exit 1)
            grep -q 'подготовленные' wizard32-top.xml
            adb exec-out screencap -p > gran2e-32-wizard-top.png

            : > wizard32-slots.xml
            for i in 1 2 3 4 5 6; do
              adb shell uiautomator dump /sdcard/wizard32-slots.xml >/dev/null 2>&1 || true
              adb shell cat /sdcard/wizard32-slots.xml > wizard32-slots.xml 2>/dev/null || true
              if grep -q 'Ранг 1 • 3 слотов' wizard32-slots.xml 2>/dev/null && grep -q 'Ранг 2 • 2 слотов' wizard32-slots.xml 2>/dev/null; then break; fi
              adb shell input swipe 540 1750 540 850 450
              sleep 1
            done
            grep -q 'Ранг 1 • 3 слотов' wizard32-slots.xml || (cat wizard32-slots.xml; exit 1)
            grep -q 'Ранг 2 • 2 слотов' wizard32-slots.xml || (cat wizard32-slots.xml; exit 1)
            adb exec-out screencap -p > gran2e-32-wizard-slots.png

            # Bard level 3 fixture.
            adb push ci-bard.xml /data/local/tmp/ci-character.xml >/dev/null
            adb shell run-as ru.gran.gran2e cp /data/local/tmp/ci-character.xml shared_prefs/gran2e_character.xml
            adb shell run-as ru.gran.gran2e rm -f shared_prefs/gran2e_spellcasting_v32.xml
            adb shell am force-stop ru.gran.gran2e
            adb shell am start -n ru.gran.gran2e/ru.gran.edge2e.MainActivityV2 --es screen spells
            sleep 5
            adb shell uiautomator dump /sdcard/bard32-top.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/bard32-top.xml > bard32-top.xml 2>/dev/null || true
            grep -q 'Bard' bard32-top.xml || (adb logcat -d -v time | tail -n 700; cat bard32-top.xml; exit 1)
            grep -q 'спонтанные' bard32-top.xml
            adb exec-out screencap -p > gran2e-32-bard-top.png

            : > bard32-slots.xml
            for i in 1 2 3 4 5 6; do
              adb shell uiautomator dump /sdcard/bard32-slots.xml >/dev/null 2>&1 || true
              adb shell cat /sdcard/bard32-slots.xml > bard32-slots.xml 2>/dev/null || true
              if grep -q 'Ранг 1 • слоты 3 / 3' bard32-slots.xml 2>/dev/null && grep -q 'Ранг 2 • слоты 2 / 2' bard32-slots.xml 2>/dev/null; then break; fi
              adb shell input swipe 540 1750 540 850 450
              sleep 1
            done
            grep -q 'Ранг 1 • слоты 3 / 3' bard32-slots.xml || (cat bard32-slots.xml; exit 1)
            grep -q 'Ранг 2 • слоты 2 / 2' bard32-slots.xml || (cat bard32-slots.xml; exit 1)
            grep -q 'Signature spell' bard32-slots.xml || (cat bard32-slots.xml; exit 1)
            adb exec-out screencap -p > gran2e-32-bard-slots.png

      - name: Upload verified Gran 2e 3.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-3.2.0-spellcasting-reference-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-32-wizard-top.png
            gran2e-32-wizard-slots.png
            gran2e-32-bard-top.png
            gran2e-32-bard-slots.png
            attack32.xml
            wizard32-top.xml
            wizard32-slots.xml
            bard32-top.xml
            bard32-slots.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
