name: Gran 2e 3.2 spellcasting reference verification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-spellcasting-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build rules and generated UI
        run: |
          python3 -m py_compile scripts/build_rules.py scripts/finalize_rules.py scripts/enrich_runtime.py scripts/inject_ability_choices.py scripts/inject_rule_constraints.py scripts/apply_ru_dictionary.py scripts/extend_runtime_2_0.py scripts/spell_rules_2_0.py scripts/prepare_2_0.py scripts/prepare_3_0.py scripts/runes_3_0.py scripts/combat_3_1.py scripts/spellcasting_3_2.py
          python3 scripts/build_rules.py
          python3 scripts/finalize_rules.py
          python3 scripts/enrich_runtime.py
          python3 scripts/inject_ability_choices.py
          python3 scripts/inject_rule_constraints.py
          python3 scripts/apply_ru_dictionary.py
          python3 scripts/extend_runtime_2_0.py
          python3 scripts/spell_rules_2_0.py
          python3 scripts/prepare_2_0.py
          python3 scripts/prepare_3_0.py
          python3 scripts/runes_3_0.py
          python3 scripts/combat_3_1.py
          python3 scripts/spellcasting_3_2.py

      - name: Verify generated mechanics
        run: |
          test -s app/src/main/assets/rules.db
          test -s app/src/main/assets/ru_names.json
          test -s app/src/main/assets/ru_text.json
          python3 - <<'PY'
          import json, sqlite3
          db=sqlite3.connect('app/src/main/assets/rules.db')
          assert db.execute('select count(*) from rules').fetchone()[0] > 16000
          wizard=json.loads(db.execute("select json from rules where category='class' and name='Wizard'").fetchone()[0])
          bard=json.loads(db.execute("select json from rules where category='class' and name='Bard'").fetchone()[0])
          assert wizard['meta'].get('traditions') == ['arcane']
          assert bard['meta'].get('traditions') == ['occult']
          db.close()
          PY
          grep -q 'class SpellcastingState' app/src/main/java/ru/gran/edge2e/SpellcastingState.java
          grep -q 'ПОДГОТОВЛЕННЫЕ СЛОТЫ' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'РЕПЕРТУАР И СЛОТЫ' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q 'CombatRules.grantedStrikes' app/src/main/java/ru/gran/edge2e/MainActivityV2.java
          grep -q "versionName '3.2.0'" app/build.gradle

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p ci-tools
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" ci-tools/apksigner.jar
          unzip -l "$APK" | grep 'assets/rules.db'
          unzip -l "$APK" | grep 'assets/ru_text.json'

      - name: Prepare character fixtures
        run: |
          cat > ci-wizard.xml <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map><string name="state">{&quot;name&quot;:&quot;CI Wizard&quot;,&quot;className&quot;:&quot;Wizard&quot;,&quot;level&quot;:3,&quot;hp&quot;:10,&quot;maxHp&quot;:10}</string></map>
          XML
          cat > ci-bard.xml <<'XML'
          <?xml version='1.0' encoding='utf-8' standalone='yes' ?>
          <map><string name="state">{&quot;name&quot;:&quot;CI Bard&quot;,&quot;className&quot;:&quot;Bard&quot;,&quot;level&quot;:3,&quot;hp&quot;:10,&quot;maxHp&quot;:10}</string></map>
          XML

      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Exercise Wizard, Bard and combat on Android 35
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/device32.sh

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Gran2e-3.2.0-spellcasting-reference-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            gran2e-32-wizard-top.png
            gran2e-32-wizard-slots.png
            gran2e-32-bard-top.png
            gran2e-32-bard-slots.png
            attack32.xml
            wizard32-top.xml
            wizard32-all.xml
            bard32-top.xml
            bard32-all.xml
            ci-tools/apksigner.jar
          if-no-files-found: error
          retention-days: 30
